services:
  - type: web
    name: funny-video-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: FIREBASE_CREDENTIALS_B64
        sync: false
